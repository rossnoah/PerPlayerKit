# Settings apply after a server restart. Older configs are backed up and migrated automatically.
config-version: 3
language: "en" # Files live in lang/. Custom language files are supported.

storage:
  type: "sqlite" # sqlite, mysql, postgresql, redis, yaml
  backup:
    enabled: true # SQLite and YAML only. Stored in backups/.
  mysql:
    host: "localhost"
    port: "3306"
    dbname: "kitdatabase"
    username: "username"
    password: "pa55w0rd"
    use-ssl: false
    maximum-pool-size: 10 #only change this if you know what your doing
  postgresql:
    host: "localhost"
    port: "5432"
    dbname: "kitdatabase"
    username: "username"
    password: "pa55w0rd"
    use-ssl: false
    maximum-pool-size: 10 #only change this if you know what your doing
  redis:
    host: "localhost"
    port: 6379
    password: "pa55w0rd"

# Shared by commands, menus, regear items, and automatic rekit. Admin data tools remain available.
locations:
  global:
    mode: deny # deny = everywhere except entries; allow = only entries.
    entries: [] # World names or "world:region" (WorldGuard). No wildcards.
  # Optional extra rules use the same mode/entries format. Global rules always apply.
  # Features: menu, kits, enderchests, public-kits, kit-room, sharing,
  # regear, heal, repair, rekit-respawn, rekit-kill.
  # regear:
  #   mode: allow
  #   entries: ["pvp:arena"]

kits:
  max-slots: 9 # 1-99. Applies to personal kits and enderchest kits.
  load:
    heal: false
    feed: false
    saturate: false
    clear-effects: false

enderchests:
  load:
    heal: false
    feed: false
    saturate: false
    clear-effects: false

# The last loaded private or public inventory kit is remembered until disconnect.
rekit:
  respawn:
    enabled: true
    delay-ticks: 0 # 20 ticks = 1 second.
    restore-enderchest: false # Also restore the player's last loaded enderchest slot.
    kits: {} # Optional world or "world:region" -> public kit ID.
  kill:
    enabled: false
    restore-enderchest: false
    kits: {} # Optional world or "world:WorldGuard-region" -> public kit ID.

# Five pages. /perplayerkit autosetup fills pages that have never been saved.
kitroom:
  items:
    1:
      name: "Crystal"
      material: "END_CRYSTAL"
    2:
      name: "Armory"
      material: "NETHERITE_SWORD"
    3:
      name: "Potions"
      material: "SPLASH_POTION"
    4:
      name: "Arrows"
      material: "TIPPED_ARROW"
    5:
      name: "Utility"
      material: "COBWEB"

# Public kits have separate definitions and contents. Autosetup fills declared starter IDs.
# /perplayerkit autosetup add-kits also adds missing bundled definitions.
publickits:
  crystal:
    name: "Crystal"
    icon: "END_CRYSTAL"
  mace:
    name: "Mace"
    icon: "MACE"
  netherite:
    name: "Netherite OP"
    icon: "NETHERITE_SWORD"
  pot:
    name: "Pot"
    icon: "SPLASH_POTION"
  uhc:
    name: "UHC"
    icon: "GOLDEN_APPLE"
  sword:
    name: "Sword"
    icon: "DIAMOND_SWORD"
  axe:
    name: "Axe"
    icon: "DIAMOND_AXE"
  ffa:
    name: "FFA"
    icon: "ENCHANTED_GOLDEN_APPLE"
  cart:
    name: "Cart"
    icon: "TNT_MINECART"

# These checks filter copies on use. Stored definitions are preserved; use /purgeitem for permanent removal.
anti-exploit:
  only-allow-kitroom-items: false #requires that items be in the kitroom before they can be used in a kit.
  import-filter: false #requires only-allow-kitroom-items to be true. prevents the duplications of items not in the kitroom by using the kit import button.
  block-spaces-in-commands: false #prevents bypassing command filters.
  prevent-shulkers-dropping-items: false #prevents shulkers from dropping items when broken. Anti-lag feature.

regear:
  modes: # command or shulker; each alias can use a different mode.
    rg: "command"
    regear: "command"
  command-cooldown-seconds: 5 #command cooldown in seconds. recommended to be low or 0 if using shulker mode.
  damage-cooldown-seconds: 5 #time in seconds to wait after taking damage before players can regear
  allow-while-using-elytra: true #set false to block regearing command while using elytra
  prevent-putting-items-in-regear-inventory: false # set true to prevent putting items inside the regear shulker inventory
  #
  # Allow regearing all items by setting:
  # invert-whitelist: true
  # whitelist: []
  #
  #
  invert-whitelist: false #setting this to true makes the whitelist a blacklist
  whitelist:
    - ENDER_PEARL
    - END_CRYSTAL
    - OBSIDIAN
    - GLOWSTONE
    - SPLASH_POTION
    - NETHERITE_PICKAXE
    - NETHERITE_SWORD
    - SHIELD
    - NETHERITE_AXE
    - NETHERITE_PICKAXE
    - GOLDEN_APPLE
    - EXPERIENCE_BOTTLE
    - TIPPED_ARROW
    - CROSSBOW
    - BOW

heal:
  clear-effects: false

death:
  condensed-drops: false

updates:
  notify-admins-on-join: true

motd:
  enabled: true
  delay-seconds: 5

broadcasts:
  enabled: true # Master switch for action messages. Scheduled announcements are separate.
  use-display-name: false
  scheduled:
    enabled: true
    period-seconds: 90
  actions:
    player-repaired:
      enabled: true
      permission: "perplayerkit.kitnotify"
    player-healed:
      enabled: true
      permission: "perplayerkit.kitnotify"
    player-opened-kit-room:
      enabled: true
      permission: "perplayerkit.kitnotify"
    player-loaded-private-kit:
      enabled: true
      permission: "perplayerkit.kitnotify"
    player-loaded-public-kit:
      enabled: true
      permission: "perplayerkit.kitnotify"
    player-loaded-enderchest:
      enabled: true
      permission: "perplayerkit.kitnotify"
    player-copied-kit:
      enabled: true
      permission: "perplayerkit.kitnotify"
    player-copied-ec:
      enabled: true
      permission: "perplayerkit.kitnotify"
    player-regeared:
      enabled: true
      permission: "perplayerkit.kitnotify"

interface:
  glass-material: BLUE_STAINED_GLASS_PANE
  main-color: "<blue>"

sounds:
  enabled: true
  success: ENTITY_PLAYER_LEVELUP
  failure: ENTITY_ITEM_BREAK
  click: UI_BUTTON_CLICK
  open-gui: UI_BUTTON_CLICK
  close-gui: UI_BUTTON_CLICK

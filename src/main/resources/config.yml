# Settings apply after a server restart. Older configs are backed up and migrated automatically.
config-version: 3
language: "en" # Files live in lang/. Custom language files are supported.

storage:
  type: "sqlite" # sqlite, mysql, postgresql, redis, yaml
  backup:
    enabled: true # SQLite and YAML only. Stored in backups/.
  mysql:
    host: "localhost"
    port: "3306"
    dbname: "kitdatabase"
    username: "username"
    password: "pa55w0rd"
    use-ssl: false
    maximum-pool-size: 10 # Maximum database connections.
  postgresql:
    host: "localhost"
    port: "5432"
    dbname: "kitdatabase"
    username: "username"
    password: "pa55w0rd"
    use-ssl: false
    maximum-pool-size: 10 # Maximum database connections.
  redis:
    host: "localhost"
    port: 6379
    password: "pa55w0rd"

# Feature names below are fixed; entries use your existing world/region names.
locations:
  global: # All player features. Admin data tools stay available.
    mode: deny # deny: everywhere except entries. allow: only entries.
    entries: [] # [] means everywhere with deny, nowhere with allow.
  # Entries are world names or "world:region". Regions require WorldGuard.
  # Feature rules add restrictions to global. Available feature names:
  # menu, kits, enderchests, public-kits, kit-room, sharing,
  # regear, heal, repair, rekit-respawn, rekit-kill.
  # regear:
  #   mode: deny
  #   entries:
  #     - world_nether # Whole world.
  #     - "world:protected_area" # One region in world.

kits:
  max-slots: 9 # 1-99. Applies to personal kits and enderchest kits.
  load:
    heal: false
    feed: false
    saturate: false
    clear-effects: false

enderchests:
  load:
    heal: false
    feed: false
    saturate: false
    clear-effects: false

# The last loaded personal or public inventory kit is remembered until disconnect.
# In kits maps, keys are your world or "world:region" names; values are public kit IDs.
rekit:
  respawn:
    enabled: true
    delay-ticks: 0 # 0 uses the next tick; 20 waits one second.
    restore-enderchest: false # Also restore the player's last loaded enderchest slot.
    kits: {} # No matching entry: restore the last loaded kit.
    # Example: kits: {world_nether: crystal, "world:protected_area": sword}
  kill:
    enabled: false
    restore-enderchest: false
    kits: {} # Same format and fallback as respawn.kits.

# Five pages. /perplayerkit autosetup fills pages that have never been saved.
kitroom:
  items:
    1:
      name: "Crystal"
      material: "END_CRYSTAL"
    2:
      name: "Armory"
      material: "NETHERITE_SWORD"
    3:
      name: "Potions"
      material: "SPLASH_POTION"
    4:
      name: "Arrows"
      material: "TIPPED_ARROW"
    5:
      name: "Utility"
      material: "COBWEB"

# Keys below (crystal, mace, ...) are public kit IDs. Contents are saved separately.
# Autosetup fills declared starter IDs.
# /perplayerkit autosetup add-kits also adds missing bundled definitions.
publickits:
  crystal:
    name: "Crystal"
    icon: "END_CRYSTAL"
  mace:
    name: "Mace"
    icon: "MACE"
  netherite:
    name: "Netherite OP"
    icon: "NETHERITE_SWORD"
  pot:
    name: "Pot"
    icon: "SPLASH_POTION"
  uhc:
    name: "UHC"
    icon: "GOLDEN_APPLE"
  sword:
    name: "Sword"
    icon: "DIAMOND_SWORD"
  axe:
    name: "Axe"
    icon: "DIAMOND_AXE"
  ffa:
    name: "FFA"
    icon: "ENCHANTED_GOLDEN_APPLE"
  cart:
    name: "Cart"
    icon: "TNT_MINECART"

# These checks filter copies on use. Stored definitions are preserved; use /purgeitem for permanent removal.
anti-exploit:
  only-allow-kitroom-items: false # Allow only materials present in the kit room.
  import-filter: false # Also filter editor imports. Requires only-allow-kitroom-items.
  block-spaces-in-commands: false
  prevent-shulkers-dropping-items: false # Remove dropped shulker boxes when they take damage.

regear:
  modes: # command or shulker; each alias can use a different mode.
    rg: "command"
    regear: "command"
  command-cooldown-seconds: 5 # Command mode only.
  damage-cooldown-seconds: 5 # Wait after taking damage.
  allow-while-using-elytra: true
  prevent-putting-items-in-regear-inventory: false
  invert-whitelist: false # true excludes the listed materials instead.
  whitelist: # With []: false restocks nothing; true allows all materials.
    - ENDER_PEARL
    - END_CRYSTAL
    - OBSIDIAN
    - GLOWSTONE
    - SPLASH_POTION
    - NETHERITE_PICKAXE
    - NETHERITE_SWORD
    - SHIELD
    - NETHERITE_AXE
    - NETHERITE_PICKAXE
    - GOLDEN_APPLE
    - EXPERIENCE_BOTTLE
    - TIPPED_ARROW
    - CROSSBOW
    - BOW

heal:
  clear-effects: false

death:
  condensed-drops: false

updates:
  notify-admins-on-join: true

motd:
  enabled: true
  delay-seconds: 5

broadcasts:
  enabled: true # Master switch for action messages. Scheduled announcements are separate.
  use-display-name: false
  scheduled:
    enabled: true
    period-seconds: 90
  actions: # Each permission selects who receives that message.
    player-repaired:
      enabled: true
      permission: "perplayerkit.kitnotify"
    player-healed:
      enabled: true
      permission: "perplayerkit.kitnotify"
    player-opened-kit-room:
      enabled: true
      permission: "perplayerkit.kitnotify"
    player-loaded-private-kit:
      enabled: true
      permission: "perplayerkit.kitnotify"
    player-loaded-public-kit:
      enabled: true
      permission: "perplayerkit.kitnotify"
    player-loaded-enderchest:
      enabled: true
      permission: "perplayerkit.kitnotify"
    player-copied-kit:
      enabled: true
      permission: "perplayerkit.kitnotify"
    player-copied-ec:
      enabled: true
      permission: "perplayerkit.kitnotify"
    player-regeared:
      enabled: true
      permission: "perplayerkit.kitnotify"

interface:
  glass-material: BLUE_STAINED_GLASS_PANE
  main-color: "<blue>"

sounds:
  enabled: true
  success: ENTITY_PLAYER_LEVELUP
  failure: ENTITY_ITEM_BREAK
  click: UI_BUTTON_CLICK
  open-gui: UI_BUTTON_CLICK
  close-gui: UI_BUTTON_CLICK

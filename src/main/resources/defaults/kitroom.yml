# Starter kit room contents shipped inside the PerPlayerKit jar.
#
# This file is NOT extracted to plugins/PerPlayerKit/. It is the stock content a
# brand new server starts with so that /kitroom is useful before an admin has
# edited anything. Once a page has been saved on a server, PerPlayerKit never
# touches it again - admins customise in-game via /kitroom, not by editing YAML.
#
# Item format:  MATERIAL [xAMOUNT] [{ key=value, ... }]
#   xAMOUNT   stack size, defaults to 1
#   potion=   base potion type, e.g. STRONG_HEALING, LONG_FIRE_RESISTANCE
#   name=     display name in MiniMessage format
#   anything else is an enchantment id, e.g. protection=4, mending=1
#
# A slot may offer alternatives separated by "||". The first one the running
# server actually has is the one it gets, so the newer PvP gear can be asked
# for first and older servers quietly fall back:
#
#   "MACE { density=5 } || NETHERITE_AXE { sharpness=5 }"
#
# Falling back is silent - that is the point of writing a chain - and only a
# slot where nothing at all resolves is worth a warning.
#
# A shulker box is written as a block instead of one line, so it can carry what
# is inside it:
#
#   3:
#     item: "PINK_SHULKER_BOX"
#     contents:
#       0-26: "SPLASH_POTION { potion=STRONG_HEALING }"
#
# Slot keys are the 0-44 grid of a kit room page (5 rows of 9); inside a shulker
# they are its own 0-26. A key may be a single slot ("12") or an inclusive range
# ("9-11").
#
# This layout was built in game and exported with `/perplayerkit export`, so it
# is what a room actually gets used like rather than a guess. Spears, maces and
# wind charges carry fallbacks, which is the only reason the same file still
# fills every page on 1.19.4.

pages:

  # Page 1 - Crystal: armour down the left, what a fight eats through the
  # middle, what you hold along the bottom.
  - id: crystal
    items:
      0: "NETHERITE_HELMET { mending=1, protection=4, unbreaking=3 }"

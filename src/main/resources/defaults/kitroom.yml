      6-8: "TOTEM_OF_UNDYING"

      9: "NETHERITE_CHESTPLATE { mending=1, protection=4, unbreaking=3 }"
      11-14: "OBSIDIAN x64"
      15-17: "TOTEM_OF_UNDYING"

      18: "NETHERITE_LEGGINGS { blast_protection=4, mending=1, swift_sneak=3, unbreaking=3 }"
      20-21: "RESPAWN_ANCHOR x64"
      22-23: "GLOWSTONE x64"
      24: "SHULKER_BOX"
      25: "CROSSBOW { mending=1, multishot=1, quick_charge=3, unbreaking=3 }"
      26: "TIPPED_ARROW x64 { potion=LONG_SLOW_FALLING }"

      27: "NETHERITE_BOOTS { depth_strider=3, feather_falling=4, mending=1, protection=4, unbreaking=3 }"
      29: "GOLDEN_APPLE x64"
      30-31: "EXPERIENCE_BOTTLE x64"
      32: "NETHERITE_PICKAXE { efficiency=5, mending=1, unbreaking=3 }"
      33: "SHULKER_BOX"
